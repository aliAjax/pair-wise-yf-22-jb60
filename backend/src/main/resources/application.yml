server:
  port: ${PORT:8080}

spring:
  application:
    name: quality-trace
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:app_db}
    username: ${DB_USER:app_user}
    password: ${DB_PASSWORD:app_password}
    driver-class-name: org.postgresql.Driver
  # 仅对嵌入式数据库（H2 测试）执行 classpath:schema.sql / data.sql；
  # 生产 PostgreSQL 由 docker-entrypoint 首次启动时执行 database/init.sql 完成初始化。
  sql:
    init:
      mode: embedded

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.generated.qualityTrace.models
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  jwt:
    secret: ${JWT_SECRET:local-dev-secret}
    # token 有效期（毫秒），默认 8 小时
    ttl-ms: ${JWT_TTL_MS:28800000}
  qualification:
    # 资质到期前预警天数
    warn-days: ${QUAL_WARN_DAYS:30}
