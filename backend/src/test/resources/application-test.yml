# 测试环境：H2 内存数据库（PostgreSQL 兼容模式）
# 不设 DB_CLOSE_DELAY，使 Context 关闭时库随之关闭，保证 @DirtiesContext 后是全新库
spring:
  datasource:
    url: jdbc:h2:mem:quality_trace;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  sql:
    init:
      mode: embedded
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
app:
  jwt:
    secret: test-secret
    ttl-ms: 3600000
  qualification:
    warn-days: 30
